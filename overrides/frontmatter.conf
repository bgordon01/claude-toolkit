# Frontmatter set on vendored skills after every sync.
# Format:  <skill>  <key>: <value>
#
# disable-model-invocation: true  → the skill only runs when you type its /command;
# Claude won't auto-trigger it and its description stays out of context.
#
# Not set on: impeccable, stop-slop (meant to auto-trigger), and
# grilling, setup-matt-pocock-skills, codebase-design (other skills call these).

grill-me         disable-model-invocation: true
to-spec          disable-model-invocation: true
to-tickets       disable-model-invocation: true
implement        disable-model-invocation: true
tdd              disable-model-invocation: true
code-review      disable-model-invocation: true
diagnosing-bugs  disable-model-invocation: true
copywriting      disable-model-invocation: true
copy-editing     disable-model-invocation: true
