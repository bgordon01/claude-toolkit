# Upstream skill sources vendored into vendor/<name>/ by ./sync.sh
#
# Format:  <name>  <github owner/repo>  <entry> [<entry> ...]
#
# Entries:
#   <path>          a skill folder (contains SKILL.md) or a glob of them; "." = repo root
#   agents=<glob>   subagent .md files, installed to ~/.claude/agents/
#   hooks=<file>    a Claude Code settings.json whose "hooks" get merged into ~/.claude/settings.json
#
# Add or remove a path to change the set, then run ./sync.sh.
# The full upstream base is tagged `full-base` in git history.

# Matt Pocock — plan → tickets → build → review.
# Support skills (called by the others): grilling, setup-matt-pocock-skills, codebase-design
mattpocock  mattpocock/skills \
  skills/productivity/grill-me  skills/productivity/grilling \
  skills/engineering/to-spec  skills/engineering/to-tickets  skills/engineering/implement \
  skills/engineering/tdd  skills/engineering/code-review  skills/engineering/diagnosing-bugs \
  skills/engineering/setup-matt-pocock-skills  skills/engineering/codebase-design

# Paul Bakaus — Impeccable design skill, its 4 subagents and its design-check hook
impeccable  pbakaus/impeccable  .claude/skills/impeccable  agents=.claude/agents/*.md  hooks=.claude/settings.json

# Copywriting — remove AI tells, write conversion copy, edit existing copy
stop-slop        hardikpandya/stop-slop          .
marketingskills  coreyhaines31/marketingskills   skills/copywriting  skills/copy-editing
