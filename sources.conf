# Upstream skill sources vendored into vendor/<name>/ by ./sync.sh
#
# Format:  <name>  <github owner/repo>  <path> [<path> ...]
# A path is a skill folder (contains SKILL.md) or a glob of skill folders.
# Skill folders are flattened into vendor/<name>/<skill>/.
# Remove or comment out a line to stop vendoring that source.

mattpocock  mattpocock/skills   skills/engineering/*  skills/productivity/*  skills/misc/*
impeccable  pbakaus/impeccable  .claude/skills/impeccable
