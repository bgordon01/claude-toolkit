name: Sync upstream skills

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest upstream skills
        run: ./sync.sh

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet -- vendor; then
            echo "No upstream changes."; exit 0
          fi
          branch=sync/upstream
          summary=$(for f in vendor/*/SOURCE; do
            echo "- **$(basename "$(dirname "$f")")** → $(grep '^repo:' "$f" | cut -d' ' -f2)/commit/$(grep '^commit:' "$f" | cut -d' ' -f2)"
          done)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "Sync upstream skills"
          git push -f origin "$branch"
          body=$(printf 'Automated sync from sources.conf.\n\n%s\n\n%s' "$summary" "$(git diff --stat HEAD~1 -- vendor | tail -1)")
          gh pr view "$branch" >/dev/null 2>&1 \
            && gh pr edit "$branch" --body "$body" \
            || gh pr create --head "$branch" --title "Sync upstream skills" --body "$body"
